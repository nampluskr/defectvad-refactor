# SPEC v0.1 SS6.1: dev-machine defaults, overridden per machine via configs/local.yaml or
# DATASET_DIR/BACKBONE_DIR env vars (SS6.2) -- never edit these two lines for a new machine.
paths:
  dataset_root: /mnt/d/datasets
  backbone_root: /mnt/d/backbones

datasets:
  oxford_pets:
    root: ${paths.dataset_root}/oxford_pets
    require: [images, annotations/trimaps, annotations/xmls, annotations/list.txt]
  mvtec_bottle:
    root: ${paths.dataset_root}/mvtec/bottle
    require: [train/good, test, ground_truth]

weights:
  resnet50: ${paths.backbone_root}/resnet50-0676ba61.pth
  efficientnet_b0: ${paths.backbone_root}/efficientnet_b0_rwightman-7f5810bc.pth
  deeplabv3_resnet50: ${paths.backbone_root}/deeplabv3_resnet50_coco-cd0a2569.pth
  fcn_resnet50: ${paths.backbone_root}/fcn_resnet50_coco-1167a1af.pth
  fasterrcnn_resnet50_fpn: ${paths.backbone_root}/fasterrcnn_resnet50_fpn_coco-258fb6c6.pth
  yolov8n: ${paths.backbone_root}/yolov8n.pt
  efficientad_teacher_small: ${paths.backbone_root}/efficientad_pretrained_weights/pretrained_teacher_small.pth
  resnet18: ${paths.backbone_root}/resnet18-f37072fd.pth
  wide_resnet50_2: ${paths.backbone_root}/wide_resnet50_2-95faca4d.pth
